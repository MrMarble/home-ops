---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  values:
    cleanPrometheusOperatorObjectNames: true
    # Slim setup: only resource usage (krr), the NFS probe (zeroscaler) and kromgo badges
    defaultRules:
      create: false
    alertmanager:
      enabled: false
    grafana:
      enabled: false
    kubeApiServer:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    coreDns:
      enabled: false
    prometheusOperator:
      admissionWebhooks:
        enabled: false
      serviceMonitor:
        selfMonitor: false
    prometheus:
      serviceMonitor:
        selfMonitor: false
      route:
        main:
          enabled: true
          hostnames:
            - prometheus.atsbhome.xyz
          parentRefs:
            - name: envoy-internal
              namespace: network
      prometheusSpec:
        externalUrl: https://prometheus.atsbhome.xyz
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        # krr looks back 14 days by default
        retention: 15d
        # Size retention only deletes whole blocks; leave headroom for the WAL and compaction
        retentionSize: 6GB
        walCompression: true
        resources:
          requests:
            cpu: 50m
            memory: 512Mi
          limits:
            memory: 1Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              resources:
                requests:
                  storage: 10Gi
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      prometheus:
        monitor:
          # Only what kromgo needs (memory and uptime badges)
          metricRelabelings:
            - action: keep
              sourceLabels: [__name__]
              regex: node_(cpu_seconds_total|memory_MemTotal_bytes|memory_MemAvailable_bytes|time_seconds|boot_time_seconds)
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
